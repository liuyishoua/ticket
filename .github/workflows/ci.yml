name: Standalone Web checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python start.py --setup-only
      - run: .venv/bin/python -m pip install pytest==9.1.1
      - run: .venv/bin/python -m pytest -q web/tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - run: .venv/bin/python -m unittest web.test_manifest_contract
      - run: node --check web/static/app.js
      - run: node --check web/static/rules.js
      - run: bash -n start.sh start.command
